<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Impfdossier CH - Demo Showcase - Anmelden</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #e8edf5 0%, #d5ddee 100%);
      min-height: 100vh;
      display: grid;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .login-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 500px;
    }

    .login-card h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #1a1f36;
      margin-bottom: .25rem;
    }

    .login-card .subtitle {
      font-size: .875rem;
      color: #6b7280;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: .875rem;
      font-weight: 500;
      color: #374151;
      margin-bottom: .375rem;
    }

    .form-group input {
      width: 100%;
      padding: .625rem .75rem;
      font-size: 1rem;
      font-family: inherit;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      outline: none;
      transition: border-color .15s;
    }

    .form-group select {
      width: 100%;
      padding: .625rem .75rem;
      font-size: 1rem;
      font-family: inherit;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      outline: none;
      transition: border-color .15s;
    }

    .form-group input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.15);
    }

    .error-msg {
      display: none;
      background: #fef2f2;
      color: #b91c1c;
      font-size: .875rem;
      padding: .625rem .75rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      border: 1px solid #fecaca;
    }

    .error-msg.visible { display: block; }


    .info-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 700px;
      max-height: 300px;
      text-align: center;
    }

    .org-logo-ehr {
      height: 50px;
    }
    .org-logo-hl7 {
      height: 65px;
    }

    .org-p {
      padding-bottom: 20px;
    }

    button {
      width: 100%;
      padding: .75rem;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background .15s;
    }

    button:hover { background: #1d4ed8; }
    button:disabled { opacity: .6; cursor: not-allowed; }

    .spinner {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .5s linear infinite;
      vertical-align: middle;
      margin-right: .5rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .login-card .hint {
      margin-top: 1.5rem;
      font-size: .8rem;
      color: #9ca3af;
      text-align: center;
    }

    .login-card .hint code {
      font-family: 'IBM Plex Mono', monospace;
      font-size: .8rem;
      background: #f3f4f6;
      padding: .125rem .375rem;
      border-radius: 3px;
    }

    .lang-switch {
      display: flex;
      justify-content: flex-end;
      gap: .25rem;
      margin: -1.25rem -.75rem 1rem 0;
    }

    .lang-switch button {
      width: auto;
      padding: .25rem .5rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: .75rem;
      font-weight: 600;
      color: #6b7280;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
    }

    .lang-switch button:hover {
      color: #1a1f36;
      background: #f3f4f6;
    }

    .lang-switch button[aria-pressed="true"] {
      color: #2563eb;
      background: #eff6ff;
      border-color: #bfdbfe;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="lang-switch" role="group" data-i18n-aria-label="languageSwitcher">
      <button type="button" data-lang="de" lang="de" aria-label="Deutsch">DE</button>
      <button type="button" data-lang="fr" lang="fr" aria-label="Français">FR</button>
      <button type="button" data-lang="it" lang="it" aria-label="Italiano">IT</button>
      <button type="button" data-lang="en" lang="en" aria-label="English">EN</button>
    </div>

    <h1>Impfdossier CH - Demo Showcase</h1>
    <p class="subtitle" data-i18n="subtitle">Bitte melden Sie sich an</p>

    <div id="error" class="error-msg" role="alert"></div>

    <form id="login-form" autocomplete="off">
      <div class="form-group">
        <label for="username" data-i18n="username">Benutzername</label>
        <select id="username" required autofocus disabled>
          <option value="" data-i18n="loadingUsers">Lade Benutzer…</option>
        </select>
      </div>
      <div class="form-group">
        <label for="password" data-i18n="password">Passwort</label>
        <input type="password" id="password" placeholder="pass123" required />
      </div>
      <button type="submit" id="submit-btn">
        <span id="btn-label">Anmelden</span>
      </button>
    </form>

    <p class="hint">
    <!-- Demo: <code>patient1</code> … <code>patient4</code> / <code>doctor1</code> · Passwort <code>pass123</code> -->
    </p>

  </div>

  <div class="info-card">
    <p class="org-p" data-i18n="jointProject">Ein gemeinsames Projekt von</p>
    <p class="org-p">
<a href="https://www.openehr.ch"><img class="org-logo-ehr" src="https://i0.wp.com/openehr.ch/wp-content/uploads/2023/07/Openehr_ch_klein.webp?w=1759&ssl=1"></a>
</p>
<p>
<a href="https://www.hl7.ch"><img class="org-logo-hl7" src="https://www.hl7.ch/static/img/logo.png"></a>
</p>
  </div>

  <script src="locales/de.js"></script>
  <script src="locales/fr.js"></script>
  <script src="locales/it.js"></script>
  <script src="locales/en.js"></script>

  <script>
    (function () {
      const SUPPORTED_LANGS = ['de', 'fr', 'it', 'en'];
      const FALLBACK_LANG = 'de';

      function supportedLanguageOf(tag) {
        const base = String(tag || '').toLowerCase().split(/[-_]/)[0];
        return SUPPORTED_LANGS.includes(base) ? base : null;
      }

      function storedLanguage() {
        try {
          return localStorage.getItem('lang');
        } catch (err) {
          return null;
        }
      }

      function browserLanguages() {
        return navigator.languages && navigator.languages.length
          ? navigator.languages
          : [navigator.language];
      }

      function detectLanguage() {
        return supportedLanguageOf(storedLanguage())
          || browserLanguages().map(supportedLanguageOf).find(Boolean)
          || FALLBACK_LANG;
      }

      const RESOURCES = window.I18N_RESOURCES || {};
      let currentLanguage = detectLanguage();

      function lookup(lng, key) {
        const value = key.split('.').reduce(function (node, part) {
          return node ? node[part] : undefined;
        }, RESOURCES[lng]);
        return typeof value === 'string' ? value : undefined;
      }

      function t(key) {
        const text = lookup(currentLanguage, key) ?? lookup(FALLBACK_LANG, key);
        if (text === undefined) {
          console.warn('[i18n] missing key "' + key + '"');
        }
        return text ?? key;
      }

      const form = document.getElementById('login-form');
      const username = document.getElementById('username');
      const password = document.getElementById('password');
      const errorEl = document.getElementById('error');
      const btn = document.getElementById('submit-btn');
      const btnLabel = document.getElementById('btn-label');
      const languageButtons = document.querySelectorAll('.lang-switch button');

      const REDIRECTS = {
        doctor:  '/producer/',
        patient: '/consumer/',
      };

      let errorKey = null;
      let loading = false;

      function render() {
        document.title = t('pageTitle');
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          el.textContent = t(el.dataset.i18n);
        });
        document.querySelectorAll('[data-i18n-aria-label]').forEach(function (el) {
          el.setAttribute('aria-label', t(el.dataset.i18nAriaLabel));
        });
        languageButtons.forEach(function (button) {
          button.setAttribute('aria-pressed', String(button.dataset.lang === currentLanguage));
        });
        errorEl.textContent = errorKey ? t(errorKey) : '';
        errorEl.classList.toggle('visible', Boolean(errorKey));
        btnLabel.replaceChildren();
        if (loading) {
          const spinner = document.createElement('span');
          spinner.className = 'spinner';
          btnLabel.append(spinner, t('submitting'));
        } else {
          btnLabel.append(t('submit'));
        }
      }

      function showError(key) {
        errorKey = key;
        render();
      }

      function hideError() {
        errorKey = null;
        render();
      }

      function setLoading(value) {
        loading = value;
        btn.disabled = value;
        render();
      }

      function base64(str) {
        return btoa(unescape(encodeURIComponent(str)));
      }

      async function loadUsers() {
        const endpoints = ['/api/users', '/users'];
        let payload = null;

        for (const endpoint of endpoints) {
          try {
            const res = await fetch(endpoint);
            if (!res.ok) {
              continue;
            }
            payload = await res.json();
            break;
          } catch (err) {
            // Try next endpoint.
          }
        }

        const users = Array.isArray(payload?.users)
          ? payload.users
          : Array.isArray(payload)
            ? payload
            : [];

        username.replaceChildren();

        if (!users.length) {
          username.disabled = true;
          btn.disabled = true;
          showError('error.noUsers');
          return;
        }

        for (const user of users) {
          const option = document.createElement('option');
          option.value = user.username;
          option.textContent = user.name || user.username;
          username.appendChild(option);
        }

        username.disabled = false;
        btn.disabled = false;
      }

      loadUsers();

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        hideError();

        const user = username.value.trim();
        const pass = password.value;
        if (!user || !pass) {
          showError('error.missingCredentials');
          return;
        }

        setLoading(true);

        try {
          const res = await fetch('/api/authenticate', {
            method: 'POST',
            headers: {
              'Authorization': 'Basic ' + base64(user + ':' + pass),
            },
          });

          if (!res.ok) {
            showError(res.status === 401 ? 'error.invalidCredentials' : 'error.loginFailed');
            setLoading(false);
            return;
          }

          const data = await res.json();
          sessionStorage.setItem('auth', JSON.stringify(data));

          const target = REDIRECTS[data.role] || 'http://localhost:3003/login.html';
          window.location.replace(target);
        } catch (err) {
          showError('error.connection');
          setLoading(false);
        }
      });

      function rememberLanguage(lng) {
        try {
          localStorage.setItem('lang', lng);
        } catch (err) {
          return;
        }
      }

      function applyLanguage(lng) {
        currentLanguage = lng;
        document.documentElement.lang = lng + '-CH';
        render();
      }

      function chooseLanguage(lng) {
        rememberLanguage(lng);
        applyLanguage(lng);
      }

      languageButtons.forEach(function (button) {
        button.addEventListener('click', function () {
          chooseLanguage(button.dataset.lang);
        });
      });

      applyLanguage(currentLanguage);
    })();
  </script>
</body>
</html>
